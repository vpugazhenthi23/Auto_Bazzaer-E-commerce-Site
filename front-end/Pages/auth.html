<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login or Create Account | AutoBazaar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Styles/main.css">
    <link rel="stylesheet" href="../Styles/auth-page.css">
</head>
<body class="auth-page">
    <header class="auth-header">
        <a class="auth-brand" href="index.html">
            <i class="fas fa-car" aria-hidden="true"></i>
            <span>Auto<span>Bazaar</span></span>
        </a>
        <a class="auth-back" href="index.html">
            <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to marketplace
        </a>
    </header>

    <main class="auth-layout">
        <section class="auth-card" aria-labelledby="authPageTitle">
            <div class="auth-card-heading">
                <h2 id="authPageTitle">Welcome to AutoBazaar</h2>
            </div>

            <div class="auth-feedback" id="authFeedback" role="status" aria-live="polite" hidden></div>
            <div class="auth-tabs" role="tablist" aria-label="Account options">
                <button class="auth-tab active" type="button" role="tab" aria-selected="true" data-tab="login">Login</button>
                <button class="auth-tab" type="button" role="tab" aria-selected="false" data-tab="register">Create Account</button>
            </div>

            <div class="auth-form active" id="loginForm">
                <form id="loginFormData">
                    <div class="form-group">
                        <label for="loginEmail">Email address</label>
                        <input type="email" name="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" name="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary auth-submit">
                        <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Login
                    </button>
                </form>
            </div>

            <div class="auth-form" id="registerForm">
                <form id="registerFormData">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="registerName">Full name</label>
                            <input type="text" name="name" id="registerName" autocomplete="name" maxlength="50" required>
                        </div>
                        <div class="form-group">
                            <label for="registerEmail">Email address</label>
                            <input type="email" name="email" id="registerEmail" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="registerPhone">Phone number</label>
                            <input type="tel" name="phone" id="registerPhone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="tel" required>
                        </div>
                        <div class="form-group">
                            <label for="registerCity">City</label>
                            <input type="text" name="city" id="registerCity" autocomplete="address-level2" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="registerAddress">Address</label>
                        <textarea name="address" id="registerAddress" rows="2" autocomplete="street-address" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="registerUserType">I want to</label>
                        <select name="userType" id="registerUserType" required>
                            <option value="">Choose one</option>
                            <option value="buy">Buy vehicles</option>
                            <option value="sell">Sell vehicles</option>
                            <option value="both">Buy and sell</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="registerPassword">Password</label>
                            <input type="password" name="password" id="registerPassword" minlength="6" autocomplete="new-password" required>
                        </div>
                        <div class="form-group">
                            <label for="registerConfirmPassword">Confirm password</label>
                            <input type="password" name="confirmPassword" id="registerConfirmPassword" minlength="6" autocomplete="new-password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary auth-submit">
                        <i class="fas fa-user-plus" aria-hidden="true"></i> Create Account
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script src="../Scripts/auth-api.js"></script>
    <script src="../Scripts/auth-page.js"></script>
</body>
</html>
